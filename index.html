<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOHOBOND</title>
  <meta name="description" content="The board is public. I am not." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #0A0A0A;
      --paper: #FAFAFA;
      --ink: #141414;
      --mist: #EBEBEB;
      --cyan: #00E8F0;
      --magenta: #F00080;
      --yellow: #F0E000;
      --dim: #8A8A8A;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--void);
      color: var(--mist);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(280px, 42vw) 1fr;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:hover { opacity: 0.7; }

    .card {
      padding: 12vh 8vw 8vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100svh;
    }
    .name {
      font-size: 13px;
      letter-spacing: 0.42em;
      font-weight: 500;
      text-transform: uppercase;
    }
    .strap {
      margin-top: 18px;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--dim);
      max-width: 16em;
      line-height: 1.45;
    }
    .links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .links a { display: inline-block; }
    .c { color: var(--cyan); }
    .m { color: var(--magenta); }
    .y { color: var(--yellow); }
    .k { color: var(--mist); }

    .well-wrap {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 6vh 0 0;
      overflow: hidden;
    }
    .well {
      width: min(58vw, 720px);
      height: 100svh;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(16, 1fr);
      gap: 3px;
      padding: 3px;
    }
    .cell {
      background: transparent;
    }
    .cell.on {
      cursor: pointer;
    }
    .cell.C { background: var(--cyan); }
    .cell.M { background: var(--magenta); }
    .cell.Y { background: var(--yellow); }
    .cell.K { background: var(--paper); }
    .cell.on:hover { filter: brightness(1.12); }
    .cell.pulse {
      animation: pulse 1.2s ease-in-out 2;
    }
    @keyframes pulse {
      0%, 100% { filter: none; }
      50% { filter: brightness(1.35); }
    }

    .egg {
      position: fixed;
      left: 8vw;
      bottom: 8vh;
      max-width: 22em;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--mist);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }
    .egg.show {
      opacity: 1;
      transform: none;
    }

    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; }
      .card { min-height: auto; padding: 10vh 8vw 4vh; }
      .well-wrap { min-height: 70svh; }
      .well { width: 100%; height: 70svh; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div class="name">Bohobond</div>
      <p class="strap">The board is public. I am not.</p>
    </header>
    <ul class="links">
      <li><a class="k" href="https://billboard.wtf">billboard.wtf</a></li>
      <li><a class="c" href="https://x.com/bohobond">x.com/bohobond</a></li>
      <li><a class="m" href="https://github.com/bohobond/billboard">github.com/bohobond/billboard</a></li>
      <li><a class="y" href="mailto:hello@bohobond.com">hello@bohobond.com</a></li>
    </ul>
  </main>

  <aside class="well-wrap" aria-hidden="true">
    <div class="well" id="well"></div>
  </aside>
  <div class="egg" id="egg"></div>

  <!--
    The well is the page.
    White tiles are paper. They are not empty.
    If you came looking for a product site: billboard.wtf
  -->
  <script>
    const COLS = 10, ROWS = 16;
    const MAP = [
      "..........",
      ".......CC.",
      "......CCCY",
      "......C.YY",
      "........Y.",
      ".....M..C.",
      "....MMM.C.",
      "....MYM.CK",
      "...YY.M.KK",
      "...Y..C.K.",
      "..YY.MMC..",
      "..Y..MMCC.",
      ".CCCCC.MM.",
      ".C.....M..",
      "YY.......M",
      "Y........."
    ];

    const EGGS = {
      "7,2": { kind: "line", text: "Not the face. The frame." },
      "8,8": { kind: "line", text: "Leave the B on the other account." },
      "9,3": { kind: "go", href: "https://x.com/bohobond" },
      "2,14": { kind: "go", href: "mailto:hello@bohobond.com" },
      "6,5": { kind: "go", href: "https://github.com/bohobond/billboard" },
      "8,7": { kind: "go", href: "https://billboard.wtf" },
      "4,8": { kind: "line", text: "Studio is free. The street is not." },
    };

    const well = document.getElementById("well");
    const egg = document.getElementById("egg");
    let last = "";

    function say(text) {
      if (text === last && egg.classList.contains("show")) return;
      last = text;
      egg.textContent = text;
      egg.classList.add("show");
      clearTimeout(say._t);
      say._t = setTimeout(() => egg.classList.remove("show"), 3200);
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const ch = MAP[r][c];
        const cell = document.createElement("div");
        cell.className = "cell" + (ch !== "." ? " on " + ch : "");
        const key = c + "," + r;
        if (EGGS[key]) {
          cell.dataset.egg = key;
        }
        cell.addEventListener("click", () => {
          const spec = EGGS[key];
          if (!spec) {
            if (ch === "K") say("Paper squares count as K.");
            else if (ch !== ".") say("The well is mid-game.");
            return;
          }
          cell.classList.add("pulse");
          if (spec.kind === "line") say(spec.text);
          if (spec.kind === "go") {
            say(spec.href.replace(/^https?:\/\//, "").replace("mailto:", ""));
            window.open(spec.href, "_blank", "noopener");
          }
        });
        well.appendChild(cell);
      }
    }

    const seq = [];
    window.addEventListener("keydown", (e) => {
      seq.push(e.key);
      if (seq.length > 8) seq.shift();
      const code = seq.join(",");
      if (code === "ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight") {
        say("The house always wins. Tonight the house is a rectangle.");
      }
      if (e.key === "b" || e.key === "B") say("The B lives on the other account.");
    });
  </script>
</body>
</html>
