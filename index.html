<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOHOBOND</title>
  <meta name="description" content="The board is public. I am not." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --void: #0A0A0A;
      --paper: #FAFAFA;
      --ink: #141414;
      --mist: #EBEBEB;
      --cyan: #00E8F0;
      --magenta: #F00080;
      --yellow: #F0E000;
      --dim: #8A8A8A;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--void);
      color: var(--mist);
      font-family: "Space Grotesk", system-ui, sans-serif;
    }
    body {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(280px, 42vw) 1fr;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.7; }
    .card {
      padding: 12vh 8vw 8vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100svh;
    }
    .name {
      font-size: 13px;
      letter-spacing: 0.42em;
      font-weight: 500;
      text-transform: uppercase;
    }
    .strap {
      margin-top: 18px;
      font-size: 15px;
      letter-spacing: 0.06em;
      color: var(--dim);
      max-width: 16em;
      line-height: 1.45;
    }
    .links {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .c { color: var(--cyan); }
    .m { color: var(--magenta); }
    .y { color: var(--yellow); }
    .k { color: var(--mist); }
    .well-wrap {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
    }
    .well {
      width: min(58vw, 720px);
      height: 100svh;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(20, 1fr);
      gap: 3px;
      padding: 3px;
    }
    .cell { background: transparent; }
    .cell.on { cursor: pointer; }
    .cell.C { background: var(--cyan); }
    .cell.M { background: var(--magenta); }
    .cell.Y { background: var(--yellow); }
    .cell.K { background: var(--paper); }
    .cell.live { filter: brightness(1.08); }
    .cell.lock { animation: lock .28s ease-out; }
    .cell.clearing { animation: clear .35s ease-in forwards; }
    .cell.on:hover { filter: brightness(1.14); }
    @keyframes lock {
      0% { transform: translateY(-6px); filter: brightness(1.4); }
      100% { transform: none; filter: none; }
    }
    @keyframes clear {
      to { opacity: 0; transform: scaleX(0.2); }
    }
    .egg {
      position: fixed;
      left: 8vw;
      bottom: 8vh;
      max-width: 22em;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--mist);
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .35s ease, transform .35s ease;
    }
    .egg.show { opacity: 1; transform: none; }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; }
      .card { min-height: auto; padding: 10vh 8vw 4vh; }
      .well-wrap { min-height: 62svh; }
      .well { width: 100%; height: 62svh; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cell.lock, .cell.clearing { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header>
      <div class="name">Bohobond</div>
      <p class="strap">The board is public. I am not.</p>
    </header>
    <ul class="links">
      <li><a class="k" href="https://billboard.wtf">billboard.wtf</a></li>
      <li><a class="c" href="https://x.com/bohobond">x.com/bohobond</a></li>
      <li><a class="m" href="https://github.com/bohobond/billboard">github.com/bohobond/billboard</a></li>
      <li><a class="y" href="mailto:hello@bohobond.com">hello@bohobond.com</a></li>
    </ul>
  </main>
  <aside class="well-wrap" aria-hidden="true">
    <div class="well" id="well"></div>
  </aside>
  <div class="egg" id="egg"></div>
  <script>
    const COLS = 10, ROWS = 20;
    const COLORS = ["C", "M", "Y", "K"];
    const SHAPES = {
      I: [[[0,0],[1,0],[2,0],[3,0]], [[0,0],[0,1],[0,2],[0,3]]],
      O: [[[0,0],[1,0],[0,1],[1,1]]],
      T: [[[0,0],[1,0],[2,0],[1,1]], [[1,0],[1,1],[1,2],[0,1]], [[0,1],[1,1],[2,1],[1,0]], [[0,0],[0,1],[0,2],[1,1]]],
      L: [[[0,0],[0,1],[0,2],[1,2]], [[0,1],[1,1],[2,1],[2,0]], [[0,0],[1,0],[1,1],[1,2]], [[0,0],[1,0],[2,0],[0,1]]],
      J: [[[1,0],[1,1],[1,2],[0,2]], [[0,0],[0,1],[1,1],[2,1]], [[0,0],[1,0],[0,1],[0,2]], [[0,0],[1,0],[2,0],[2,1]]],
      S: [[[1,0],[2,0],[0,1],[1,1]], [[0,0],[0,1],[1,1],[1,2]]],
      Z: [[[0,0],[1,0],[1,1],[2,1]], [[1,0],[0,1],[1,1],[0,2]]]
    };
    const NAMES = Object.keys(SHAPES);
    const SEED = [
      "..........","..........","..........","..........","..........",
      "..........","..........",".......CC.","......CCY.",".....M.CY.",
      "....MMM.C.","....MYM.CK","...YY.M.KK","..YY.MMC..","..Y..MMCC.",
      ".CCCCC.MM.",".C.....M..","YY.......M","Y.........",".........."
    ];
    const LINES = [
      "The well is mid-game.",
      "Not the face. The frame.",
      "Leave the B on the other account.",
      "Studio is free. The street is not.",
      "Paper squares count as K."
    ];
    const wellEl = document.getElementById("well");
    const egg = document.getElementById("egg");
    const cells = [];
    const board = [];
    let piece = null, last = 0, paused = false;
    const dropMs = 420;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    for (let r = 0; r < ROWS; r++) {
      board[r] = SEED[r].split("");
      for (let c = 0; c < COLS; c++) {
        const el = document.createElement("div");
        el.className = "cell";
        el.addEventListener("click", () => tap(c, r));
        wellEl.appendChild(el);
        cells.push(el);
      }
    }
    function at(c, r) { return cells[r * COLS + c]; }
    function say(text) {
      egg.textContent = text;
      egg.classList.add("show");
      clearTimeout(say._t);
      say._t = setTimeout(() => egg.classList.remove("show"), 3200);
    }
    function tap(c, r) {
      const ch = painted(c, r);
      if (!ch) return;
      if (ch === "K") say("Paper squares count as K.");
      else if (ch === "C") { say("x.com/bohobond"); window.open("https://x.com/bohobond", "_blank", "noopener"); }
      else if (ch === "M") { say("github.com/bohobond/billboard"); window.open("https://github.com/bohobond/billboard", "_blank", "noopener"); }
      else if (ch === "Y") { say("hello@bohobond.com"); window.open("mailto:hello@bohobond.com", "_blank", "noopener"); }
    }
    function painted(c, r) {
      if (piece) {
        for (const [x, y] of cellsOf(piece)) if (x === c && y === r) return piece.color;
      }
      return board[r][c] === "." ? "" : board[r][c];
    }
    function cellsOf(p) {
      return SHAPES[p.name][p.rot].map(([x, y]) => [p.x + x, p.y + y]);
    }
    function fits(p) {
      return cellsOf(p).every(([x, y]) =>
        x >= 0 && x < COLS && y < ROWS && (y < 0 || board[y][x] === ".")
      );
    }
    function spawn() {
      const name = NAMES[(Math.random() * NAMES.length) | 0];
      const color = COLORS[(Math.random() * COLORS.length) | 0];
      const rot = (Math.random() * SHAPES[name].length) | 0;
      piece = { name, color, rot, x: 4 + ((Math.random() * 3) | 0) - 1, y: -1 };
      if (!fits(piece)) {
        for (let r = 0; r < 6; r++) board[r] = "..........".split("");
        piece.y = 0;
        if (!fits(piece)) piece = null;
      }
    }
    function lock() {
      if (!piece) return;
      for (const [x, y] of cellsOf(piece)) {
        if (y >= 0 && y < ROWS) {
          board[y][x] = piece.color;
          at(x, y).classList.add("lock");
        }
      }
      piece = null;
      sweep();
    }
    function sweep() {
      const full = [];
      for (let r = 0; r < ROWS; r++) if (board[r].every((ch) => ch !== ".")) full.push(r);
      if (!full.length) return;
      full.forEach((r) => { for (let c = 0; c < COLS; c++) at(c, r).classList.add("clearing"); });
      setTimeout(() => {
        full.sort((a, b) => b - a).forEach((r) => {
          board.splice(r, 1);
          board.unshift("..........".split(""));
        });
        paint();
        if (full.length >= 2) say(LINES[(Math.random() * LINES.length) | 0]);
      }, 280);
    }
    function think() {
      if (!piece) return;
      if (Math.random() < 0.45) {
        const next = Object.assign({}, piece, { x: piece.x + (Math.random() < 0.5 ? -1 : 1) });
        if (fits(next)) piece = next;
      }
      if (Math.random() < 0.18) {
        const next = Object.assign({}, piece, { rot: (piece.rot + 1) % SHAPES[piece.name].length });
        if (fits(next)) piece = next;
      }
    }
    function step() {
      if (!piece) spawn();
      if (!piece) return;
      think();
      const down = Object.assign({}, piece, { y: piece.y + 1 });
      if (fits(down)) piece = down;
      else lock();
    }
    function paint() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const live = piece && cellsOf(piece).some(([x, y]) => x === c && y === r);
          const ch = live ? piece.color : board[r][c];
          const on = ch && ch !== ".";
          at(c, r).className = "cell" + (on ? " on " + ch : "") + (live ? " live" : "");
        }
      }
    }
    function loop(t) {
      if (!paused && !reduce) {
        if (!last) last = t;
        if (t - last >= dropMs) { step(); last = t; }
      }
      paint();
      requestAnimationFrame(loop);
    }
    if (reduce) paint();
    else { spawn(); requestAnimationFrame(loop); }
    document.addEventListener("visibilitychange", () => { paused = document.hidden; last = 0; });
    const seq = [];
    window.addEventListener("keydown", (e) => {
      seq.push(e.key);
      if (seq.length > 8) seq.shift();
      if (seq.join(",") === "ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,ArrowLeft,ArrowRight") {
        say("The house always wins. Tonight the house is a rectangle.");
      }
      if (e.key === "b" || e.key === "B") say("The B lives on the other account.");
    });
  </script>
</body>
</html>
